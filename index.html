<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Abdelrahman Ragab, React, Next.js, Magento 2, Portfolio, Web Development, Front-End Developer, Projects"
    />
    <meta name="author" content="Abdelrahman Ragab" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Abdelrahman Ragab's Portfolio</title>

    <!-- Theme Color for all devices — a distinctive charcoal/cream pair, kept neutral across the 3 accent palettes -->
    <meta name="theme-color" content="#EDEAE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17161B" media="(prefers-color-scheme: dark)" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "dateCreated": "2025-01-01",
        "mainEntity": {
          "@type": "Person",
          "name": "Abdelrahman Ragab",
          "jobTitle": "Front-End Developer",
          "url": "https://abdelrahman-ragab-portfolio-ten.vercel.app/",
          "sameAs": [
            "https://github.com/Abdelrahman5243",
            "https://linkedin.com/in/abdelrahman-ragab-9443b8264"
          ]
        }
      }
    </script>

    <!-- Optimized Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:opsz,wght@14..32,300..800&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:opsz,wght@14..32,300..800&display=swap"
      />
    </noscript>

    <!-- Open Graph constants. Per-route og/twitter tags (title, description,
         url, type, image) are rendered by src/components/SEO.jsx; defining them
         here too would leave duplicates that Helmet cannot replace. -->
    <meta property="og:site_name" content="Abdelrahman Ragab's Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("currentMode") || "dark";
          document.body.classList.add(mode);
          var palette = localStorage.getItem("currentPalette");
          var validPalettes = { slate: true, obsidian: true, carbon: true };
          if (!validPalettes[palette]) palette = "slate";
          document.documentElement.setAttribute("data-palette", palette);
          var lang = localStorage.getItem("language") === "ar" ? "ar" : "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
